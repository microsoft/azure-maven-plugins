---
id:               configure-app-env-name
promote:          "Input the Azure Container App Environment name (***${default_val}***):"
default_val:      'env-${project.getArtifactId().replaceAll("[^-a-z0-9]", "").toLowerCase()}'
resource:         Environment
property:         environmentName
expression:       true
required:         true

---
id:               configure-resource-group-name
promote:          "Input the resource group name (***${default_val}***):"
default_val:      'rg-${project.getArtifactId().replaceAll("[^-a-z0-9]", "").toLowerCase()}'
expression:       true
required:         true
resource:         Environment
property:         resourceGroup

---
id:               configure-region
promote:
  header: "Regions:"
  many: "Select region for Azure Container Apps:"
message:
  auto_select:    "There is only one valid region (***${ regions[0] }***) for your project, will use it automatically."
  select_none:    "You have not selected any region, 'config' will terminate."
required:         true
auto_select:      true
default_index:    0

---
id:               select-subscriptions
promote:
       header:    "Available subscription:"
       many:      "Select subscription"
required:         true
auto_select:      true
message:
  empty_options:  "Cannot find any subscriptions."
  auto_select:    "There is only one subscription (***${ subscriptions[0].displayName() }***) in your account, will use it automatically."
  select_none:    "You have not selected any subscriptions, 'config' will terminate."
default_index:    0

---
id:               select-ACA-env
promote:
  header:       "Available Azure Container App Environments:"
  many:         "Select Azure Container App Environment for deployment:"
message:
  empty_options:  "There are no Azure Container App Environment in current subscription, please create it in Azure Portal."
  auto_select:    "There is only one Azure Container App Environment (***${ environments[0].name() }***) in current subscription, will use it automatically."
  select_none:    "You have not selected any Azure Container App Environment, 'config' will terminate."
required:         true
auto_select:      true
default_index:    0

---
id:               select-app
promote:
  header:       "Available Azure Container Apps:"
  many:         "Select Azure Container App for deployment:"
message:
  empty_options:  "There are no Azure Container App in current environment, please create it."
  auto_select:    "There is only one Azure Container App (***${ apps[0].name() }***) in current environment, will use it automatically."
  select_none:    "You have not selected any Azure Container App, 'config' will terminate."
required:         true
auto_select:      true
default_index:    0

---
id:               select-registry
promote:
  header:       "Available Azure Container Registries:"
  many:         "Select Azure Container Registry for deployment:"
message:
  empty_options:  "There are no Azure Container Registry in current subscription, please create it."
  auto_select:    "There is only one Azure Container Registry (***${ registries[0].name() }***) in current subscription, will use it automatically."
  select_none:    "You have not selected any Azure Container Registry, 'config' will terminate."
required:         true
auto_select:      true
default_index:    0

---
id:               select-identity
promote:
  header:       "Available User Assigned Identities:"
  many:         "Select User Assigned Identity for deployment:"
message:
  empty_options:  "There are no User Assigned Identity  in current subscription, please create it."
  auto_select:    "There is only one User Assigned Identity (***${ identities[0].name() }***) in current subscription, will use it automatically."
  select_none:    "You have not selected any User Assigned Identity, 'config' will terminate."
required:         true
auto_select:      true
default_index:    0

---
id:               configure-app-name
promote:          "Input the app name (***${default_val}***):"
resource:         App
property:         appName
default_val:          '${project.getArtifactId().replaceAll("[^-a-z0-9]", "").toLowerCase()}'
expression:       true
required:         true

---
id:               configure-deployment-type
promote:          "Input deployment type for apps (***${schema.default}***):"
resource:         App
property:         deploymentType

---
id:               configure-code-dir
promote:          "Input directory for source code (***${schema.default}***):"
resource:         App
property:         directory

---
id:               configure-artifact-dir
promote:          "Input directory for artifact (***${schema.default}***):"
resource:         App
property:         directory

---
id:               configure-image
promote:          "Input image (***${schema.default}***):"
resource:         App
property:         image

---
id:               configure-registry-name
promote:          "Input registry name:"
resource:         App
property:         registryName

---
id:               configure-min-replicas
promote:          "Input min replicas for apps [***${schema.minimum}***-***${schema.maximum}***] (***${schema.default}***):"
resource:         App
property:         minReplicas

---
id:               configure-max-replicas
promote:          "Input max replicas for apps of standard consumption plan [***${schema.minimum}***-***${schema.maximum}***] (***${schema.default}***):"
resource:         App
property:         maxReplicas

---
id:               configure-ingress-port
promote:          "Input the target port [***${schema.minimum}***-***${schema.maximum}***] (***${schema.default}***):"
resource:         App
property:         ingressPort



---
id:               confirm
promote:
  header:     'Summary of properties:'
  footer:     "Confirm to save all the above configurations (Y/n):"
message:
  one: 'Configurations are saved to: ***${project.getFile().toString()}***'
  many:         >-
    Configurations are saved to the following pom.xml files:${"\n"}
    <% for(project in projects){ %>
    ***${ project.getFile().toString()}***${"\n"}
    <% } %>
  skip:         'You have quit the config goal, your pom files will not be changed.'
default_val:          true
required:         true